version: '3.9'

services:
  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    ports:
      - '5000:5000'

    environment:
      MONGO_URI: mongodb://mongo:27017/codebattle
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - mongo
      - redis

    volumes:
      - ./server:/app
      - /app/node_modules

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile.worker

    environment:
      MONGO_URI: mongodb://mongo:27017/codebattle
      REDIS_HOST: redis
      REDIS_PORT: 6379

    depends_on:
      - mongo
      - redis

    volumes:
      - ./server:/app
      - /app/node_modules

      # IMPORTANT
      - /var/run/docker.sock:/var/run/docker.sock

  mongo:
    image: mongo:7

    ports:
      - '27017:27017'

    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine

    ports:
      - '6379:6379'

volumes:
  mongo_data: